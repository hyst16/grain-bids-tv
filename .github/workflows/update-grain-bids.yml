name: Update Grain Bids

# GitHub's schedule trigger is unreliable (runs can be late or skipped for hours), so instead
# of one short run per 10 minutes, one long run scrapes every 10 minutes for ~5h40m and then
# starts its own replacement. The schedule is only a backup that restarts the loop if it
# ever stops; while a loop is running, backup runs exit after a few seconds.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # Code pushes start a loop too (the bot's own data commits don't trigger workflows).
  push:
    branches: [main]
    paths: ['.github/workflows/update-grain-bids.yml', 'scraper.js', 'lib/**', 'package.json']

permissions:
  contents: write   # commit data
  actions: write    # see other runs, start the next loop
  issues: write     # open/close the "scraper needs attention" alert

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if a loop is already running
        id: guard
        run: |
          older=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-grain-bids.yml \
            --status in_progress --json databaseId \
            --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")
          if [ "${older:-0}" -gt 0 ]; then
            echo "Another loop is already scraping; exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browser
        if: steps.guard.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        if: steps.guard.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium

      - name: Scrape every 10 minutes
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo="$GITHUB_REPOSITORY"

          # Open a GitHub issue (GitHub emails the repo owner) when data/health.json reports a
          # problem two rounds in a row; keep it updated; close it once the scraper recovers.
          bad_rounds=0
          alert() {
            [ -f data/health.json ] || return 0
            open=$(gh issue list --repo "$repo" --label scraper-alert --state open --json number --jq '.[0].number // empty' 2>/dev/null)
            if [ "$(jq -r .ok data/health.json)" = "false" ]; then
              bad_rounds=$(( bad_rounds + 1 ))
              [ "$bad_rounds" -ge 2 ] || return 0
              body=$(jq -r '"The grain bids scraper found a problem (last checked \(.checkedAt)):\n\n" + ([.problems[] | "- " + .] | join("\n")) + "\n\nScreens keep showing the last good prices meanwhile. This issue updates itself and closes when the scraper recovers."' data/health.json)
              if [ -z "$open" ]; then
                gh label create scraper-alert --repo "$repo" --color e1523e --description "Opened automatically by the grain bids scraper" --force >/dev/null 2>&1
                gh issue create --repo "$repo" --title "Grain bids scraper needs attention" --label scraper-alert --body "$body" >/dev/null
              else
                gh issue edit "$open" --repo "$repo" --body "$body" >/dev/null
              fi
            else
              bad_rounds=0
              [ -z "$open" ] || gh issue close "$open" --repo "$repo" --comment "Recovered at $(jq -r .checkedAt data/health.json): $(jq -r .summary data/health.json)" >/dev/null
            fi
          }

          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # Pick up any code pushed since this loop started.
            git pull -q --rebase origin main || git rebase --abort || true
            node scraper.js || echo "Scrape failed; screens keep the last good prices."
            alert || echo "::warning::Could not update the alert issue."
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Update grain bids $(date -u +'%Y-%m-%dT%H:%MZ')"
              git push -q origin HEAD:main \
                || { git pull -q --rebase origin main && git push -q origin HEAD:main; } \
                || echo "::warning::Could not push data this round."
            fi
            # Sleep until the next 10-minute mark (:00, :10, :20, ...).
            now=$(date +%s)
            sleep $(( 600 - now % 600 ))
          done

      - name: Start the next loop
        if: always() && steps.guard.outputs.skip == 'false'
        run: gh workflow run update-grain-bids.yml --repo "$GITHUB_REPOSITORY" --ref main
